<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Değiştir — SIP Arama Paneli</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .box {
      background: #1a1d27; border: 1px solid #2d3148;
      border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 420px;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px; justify-content: space-between;
    }
    .header h1 { font-size: 1.1rem; color: #a78bfa; font-weight: 700; }
    .back { font-size: 0.82rem; color: #64748b; text-decoration: none;
            padding: 6px 12px; border: 1px solid #2d3148; border-radius: 6px; }
    .back:hover { color: #e2e8f0; }

    label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 5px; margin-top: 16px; }
    input[type=text], input[type=password] {
      width: 100%; background: #0f1117; border: 1px solid #2d3148;
      border-radius: 8px; color: #e2e8f0; padding: 10px 14px;
      font-size: 0.9rem; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: #7c3aed; }

    .btn {
      width: 100%; margin-top: 24px; padding: 11px;
      background: #7c3aed; color: #fff; border: none;
      border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    .btn:hover { opacity: 0.88; }

    .error {
      background: #450a0a; border: 1px solid #7f1d1d;
      border-radius: 8px; color: #fca5a5;
      padding: 10px 14px; font-size: 0.85rem; margin-top: 16px;
    }
    .success {
      background: #14532d; border: 1px solid #166534;
      border-radius: 8px; color: #86efac;
      padding: 10px 14px; font-size: 0.85rem; margin-top: 16px;
    }
    .divider { border: none; border-top: 1px solid #2d3148; margin: 20px 0; }
    .hint { font-size: 0.78rem; color: #475569; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="header">
      <h1>🔒 Giriş Bilgilerini Değiştir</h1>
      <a href="/" class="back">← Panele Dön</a>
    </div>

    <form method="POST">
      <label>Mevcut Şifre</label>
      <input type="password" name="old_password" placeholder="Mevcut şifreniz" required>

      <hr class="divider">

      <label>Yeni Kullanıcı Adı</label>
      <input type="text" name="new_username" value="{{ current_user }}" required>

      <label>Yeni Şifre</label>
      <input type="password" name="new_password" placeholder="En az 6 karakter" required>
      <p class="hint">En az 6 karakter.</p>

      <label>Yeni Şifre (Tekrar)</label>
      <input type="password" name="new_password2" placeholder="Şifreyi tekrar girin" required>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      {% if success %}
      <div class="success">{{ success }}</div>
      {% endif %}

      <button type="submit" class="btn">Kaydet</button>
    </form>
  </div>
</body>
</html>
