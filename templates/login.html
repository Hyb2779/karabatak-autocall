<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — SIP Arama Paneli</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .logo h1 { font-size: 1.2rem; color: #a78bfa; font-weight: 700; }

    label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 5px; margin-top: 16px; }
    input[type=text], input[type=password] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #7c3aed; }

    .btn-login {
      width: 100%;
      margin-top: 24px;
      padding: 11px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: 0.88; }


    .ncs-badge {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 24px; padding-top: 16px; border-top: 1px solid #2d3148;
      font-size: 0.72rem; color: #5b6272; letter-spacing: .03em;
    }
    .ncs-badge b { color: #a78bfa; font-weight: 700; }

    .error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      color: #fca5a5;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
        <path d="M22 16.92v3a2 2 0 01-2.18 2A19.79 19.79 0 013.09 4.18 2 2 0 015.07 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L9.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
      <h1>SIP Arama Paneli</h1>
    </div>

    <form method="POST">
      <label>Kullanıcı Adı</label>
      <input type="text" name="username" placeholder="admin" autofocus>
      <label>Şifre</label>
      <input type="password" name="password" placeholder="••••••••">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit" class="btn-login">Giriş Yap</button>
    </form>
    <div class="ncs-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5">
        <path d="M22 16.92v3a2 2 0 01-2.18 2A19.79 19.79 0 013.09 4.18 2 2 0 015.07 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L9.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
      <span>Powered by <b>NCS</b> — Nitro Core Systems</span>
    </div>
  </div>
</body>
</html>
